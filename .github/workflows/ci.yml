name: CI

# Every `uses:` below is pinned to a commit SHA, with the version tag in a
# trailing comment. A mutable major tag is a moving target: whoever can move
# `v4` decides what this repository runs. CI is the same pipeline locally as it
# is here — `npm run verify` plus `npm run scan:secrets`, which is also what a
# developer runs by hand.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: README Results table matches its record
        run: npm run report:check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build static site (Vite)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, Chromium)
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: npm audit (reported, not blocking)
        run: npm audit || true
        continue-on-error: true

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The scan is a repository script rather than a marketplace action, so this
      # job and a developer's machine run the identical command over the
      # identical binary (8.24.3, checksum-verified against the release before it
      # is executed). `gitleaks/gitleaks-action@v2` cannot be used here: it
      # derives its range as `<parent of the first pushed commit>^..<head>`, and
      # on a repository's first push that commit is the root, so git answers
      # "ambiguous argument" and the job fails having scanned nothing. A binary
      # scanning `--all` cannot fail that way. See docs/PLAN.md, "The first push".
      #
      # `--self-check` then pipes a generated, credential-shaped string through
      # the rules and fails if it is *not* reported, so an allowlist that grew
      # too broad cannot quietly turn the scan into a no-op.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Scan the whole history for secrets
        run: npm run scan:secrets -- --self-check

      - name: Upload the gitleaks report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          retention-days: 7
